/*
 * iOS 27 Liquid Glass Design Tokens
 * 健身日历 APP · 液态玻璃风格
 *
 * 核心视觉特征：
 *   - 半透明磨砂玻璃材质 (backdrop-filter: blur + saturate)
 *   - 多层玻璃叠加产生深度感
 *   - 鲜艳的系统色彩透过玻璃层
 *   - 极大圆角 (接近药丸形)
 *   - 微妙的边框高光模拟光线折射
 *   - 渐变背景透过玻璃可见
 */

:root {
  /* ===== GLASS MATERIAL TOKENS ===== */
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-bg-raised: rgba(255, 255, 255, 0.62);
  --glass-bg-elevated: rgba(255, 255, 255, 0.78);
  --glass-bg-subtle: rgba(255, 255, 255, 0.25);
  --glass-blur: 24px;
  --glass-blur-heavy: 40px;
  --glass-blur-light: 12px;
  --glass-saturate: 1.8;

  --glass-border: rgba(255, 255, 255, 0.35);
  --glass-border-bright: rgba(255, 255, 255, 0.65);
  --glass-border-subtle: rgba(255, 255, 255, 0.18);
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-inner-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
  --glass-outer-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --glass-outer-shadow-raised: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);

  /* ===== BACKGROUND ===== */
  --background: #f2f2f7;
  --background-gradient: linear-gradient(145deg, #e8f0fe 0%, #f2f2f7 30%, #fce4ec 60%, #f2f2f7 100%);
  --foreground: #1d1d1f;

  /* ===== CARD ===== */
  --card: var(--glass-bg);
  --card-foreground: #1d1d1f;
  --card-hover: var(--glass-bg-raised);

  /* ===== PRIMARY / ACCENT ===== */
  --primary: #007AFF;
  --primary-foreground: #ffffff;
  --primary-glow: rgba(0, 122, 255, 0.25);
  --primary-glass: rgba(0, 122, 255, 0.12);

  /* ===== SECONDARY ===== */
  --secondary: rgba(120, 120, 128, 0.12);
  --secondary-foreground: #1d1d1f;

  /* ===== MUTED ===== */
  --muted: rgba(120, 120, 128, 0.08);
  --muted-foreground: #8e8e93;

  /* ===== ACCENT ===== */
  --accent: rgba(120, 120, 128, 0.06);
  --accent-foreground: #1d1d1f;

  /* ===== STATE COLORS ===== */
  --destructive: #FF3B30;
  --destructive-foreground: #ffffff;
  --destructive-glow: rgba(255, 59, 48, 0.2);
  --destructive-glass: rgba(255, 59, 48, 0.1);

  --success: #30D158;
  --success-foreground: #ffffff;
  --success-glow: rgba(48, 209, 88, 0.2);
  --success-glass: rgba(48, 209, 88, 0.1);

  --warning: #FF9F0A;
  --warning-foreground: #ffffff;
  --warning-glow: rgba(255, 159, 10, 0.2);
  --warning-glass: rgba(255, 159, 10, 0.1);

  /* ===== BORDER ===== */
  --border: var(--glass-border);
  --input: var(--glass-border);
  --ring: var(--primary);

  /* ===== ICON ===== */
  --icon: #1d1d1f;
  --icon-muted: #8e8e93;

  /* ===== CHART COLORS ===== */
  --chart-1: #30D158;
  --chart-2: #007AFF;
  --chart-3: #FF9F0A;
  --chart-4: #5856D6;
  --chart-5: #FF2D55;

  /* ===== TYPOGRAPHY ===== */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --font-serif: -apple-system, BlinkMacSystemFont, 'SF Pro Display', serif, system-ui;
  --font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
  --tracking-normal: 0em;

  /* ===== RADIUS ===== */
  --radius: 1.4rem;
  --radius-lg: 1.6rem;
  --radius-xl: 2rem;

  /* ===== SHADOWS ===== */
  --shadow-2xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.1), 0 8px 20px rgba(0, 0, 0, 0.05);
  --shadow-2xl: 0 28px 80px rgba(0, 0, 0, 0.12);

  /* ===== SPACING ===== */
  --spacing: 0.25rem;

  /* ===== SIDEBAR ===== */
  --sidebar: var(--glass-bg);
  --sidebar-foreground: #1d1d1f;
  --sidebar-primary: var(--primary);
  --sidebar-primary-foreground: var(--primary-foreground);
  --sidebar-accent: var(--glass-bg-raised);
  --sidebar-accent-foreground: #1d1d1f;
  --sidebar-border: var(--glass-border);
  --sidebar-ring: var(--primary);
}

/* ===== DARK MODE ===== */
.dark {
  --glass-bg: rgba(30, 30, 30, 0.55);
  --glass-bg-raised: rgba(44, 44, 46, 0.7);
  --glass-bg-elevated: rgba(58, 58, 60, 0.8);

  --glass-outer-shadow-raised: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);

  --background: #000000;
  --background-gradient: linear-gradient(145deg, #0a1628 0%, #000000 30%, #1a0a1e 60%, #000000 100%);
  --foreground: #f5f5f7;

  --card: var(--glass-bg);
  --card-foreground: #f5f5f7;
  --card-hover: var(--glass-bg-raised);

  --primary: #0A84FF;
  --primary-foreground: #ffffff;
  --primary-glow: rgba(10, 132, 255, 0.3);
  --primary-glass: rgba(10, 132, 255, 0.15);

  --secondary: rgba(120, 120, 128, 0.2);

  --muted: rgba(120, 120, 128, 0.12);

  --accent: rgba(120, 120, 128, 0.1);

  --destructive: #FF453A;
  --destructive-glow: rgba(255, 69, 58, 0.3);

  --success: #30D158;
  --success-glow: rgba(48, 209, 88, 0.3);

  --warning: #FFD60A;
  --warning-glow: rgba(255, 214, 10, 0.25);
  --warning-glass: rgba(255, 214, 10, 0.12);

  --border: var(--glass-border);
  --input: var(--glass-border);
  --ring: var(--primary);

  --icon: #f5f5f7;
  --icon-muted: #98989d;

  --chart-1: #30D158;
  --chart-2: #0A84FF;
  --chart-3: #FFD60A;
  --chart-4: #5E5CE6;
  --chart-5: #FF375F;

  --shadow-2xs: 0 1px 2px rgba(0, 0, 0, 0.2);

  --shadow-2xl: 0 28px 80px rgba(0, 0, 0, 0.5);
}

/*
 * iOS 27 Liquid Glass Component Styles
 * 健身日历 APP
 */

/* ===== GLASS CARD ===== */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-outer-shadow), var(--glass-inner-shadow);
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.glass-card:hover {
  background: var(--glass-bg-raised);
  box-shadow: var(--glass-outer-shadow-raised), var(--glass-inner-shadow);
}

.glass-card-raised {
  background: var(--glass-bg-raised);
  backdrop-filter: blur(var(--glass-blur-heavy)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur-heavy)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-border-bright);
  border-radius: var(--radius-xl);
  box-shadow: var(--glass-outer-shadow-raised), var(--glass-inner-shadow);
}

.glass-card-subtle {
  background: var(--glass-bg-subtle);
  backdrop-filter: blur(var(--glass-blur-light)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur-light)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius);
  box-shadow: var(--shadow-xs);
}

/* ===== GLASS PILL BUTTON ===== */
.glass-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  padding: 0.5rem 1.25rem;
  border-radius: 999px;
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur-light)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur-light)) saturate(var(--glass-saturate));
  transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  white-space: nowrap;
}

.glass-btn-primary {
  background: var(--primary-glass);
  color: var(--primary);
  border-color: rgba(0, 122, 255, 0.25);
  box-shadow: 0 0 16px var(--primary-glow), var(--glass-inner-shadow);
}

.glass-btn-primary:hover {
  background: rgba(0, 122, 255, 0.2);
  box-shadow: 0 0 24px var(--primary-glow), var(--glass-inner-shadow);
}

.glass-btn-primary.active {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
}

.glass-btn-ghost {
  background: var(--glass-bg);
  color: var(--foreground);
}

.glass-btn-ghost:hover {
  background: var(--glass-bg-raised);
}

.glass-btn-ghost.active {
  background: var(--glass-bg-raised);
  color: var(--primary);
  border-color: var(--primary);
}

/* ===== GLASS TOGGLE ===== */
.glass-toggle {
  position: relative;
  width: 51px;
  height: 31px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur-light));
  -webkit-backdrop-filter: blur(var(--glass-blur-light));
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  flex-shrink: 0;
}

.glass-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: var(--foreground);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.glass-toggle.active {
  background: var(--success);
  border-color: var(--success);
  box-shadow: 0 0 12px var(--success-glow);
}

.glass-toggle.active::after {
  left: 22px;
  background: var(--primary-foreground);
}

/* ===== GLASS INPUT ===== */
.glass-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg-subtle);
  backdrop-filter: blur(var(--glass-blur-light));
  -webkit-backdrop-filter: blur(var(--glass-blur-light));
  font-family: var(--font-sans);
  font-size: 0.875rem;
  color: var(--foreground);
  transition: all 0.25s ease;
  outline: none;
}

.glass-input::placeholder {
  color: var(--muted-foreground);
}

.glass-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glass), var(--glass-inner-shadow);
  background: var(--glass-bg);
}

/* ===== GLASS SEGMENTED CONTROL ===== */
.glass-segmented {
  display: inline-flex;
  background: var(--glass-bg-subtle);
  backdrop-filter: blur(var(--glass-blur-light));
  -webkit-backdrop-filter: blur(var(--glass-blur-light));
  border: 1px solid var(--glass-border-subtle);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}

.glass-segmented-item {
  padding: 0.4rem 1rem;
  border-radius: 999px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--muted-foreground);
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
}

.glass-segmented-item.active {
  background: var(--glass-bg-raised);
  color: var(--foreground);
  box-shadow: var(--glass-inner-shadow), var(--shadow-xs);
}

/* ===== GLASS BADGE ===== */
.glass-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur-light));
  -webkit-backdrop-filter: blur(var(--glass-blur-light));
}

.glass-badge-blue {
  background: var(--primary-glass);
  color: var(--primary);
  border-color: rgba(0, 122, 255, 0.2);
}

.glass-badge-green {
  background: var(--success-glass);
  color: var(--success);
  border-color: rgba(48, 209, 88, 0.2);
}

.glass-badge-red {
  background: var(--destructive-glass);
  color: var(--destructive);
  border-color: rgba(255, 59, 48, 0.2);
}

.glass-badge-amber {
  background: var(--warning-glass);
  color: var(--warning);
  border-color: rgba(255, 159, 10, 0.2);
}

.glass-badge-purple {
  background: rgba(88, 86, 214, 0.12);
  color: var(--chart-4);
  border-color: rgba(88, 86, 214, 0.2);
}

/* ===== GLASS TAB BAR ===== */
.glass-tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  padding: 0.5rem 1rem;
  padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
  background: var(--glass-bg-elevated);
  backdrop-filter: blur(var(--glass-blur-heavy)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur-heavy)) saturate(var(--glass-saturate));
  border-top: 1px solid var(--glass-border);
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.06);
}

.glass-tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  padding: 0.25rem 0.75rem;
  border-radius: var(--radius);
  color: var(--muted-foreground);
  font-size: 0.625rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s ease;
}

.glass-tab-item.active {
  color: var(--primary);
}

.glass-tab-item.active .tab-icon-wrap {
  background: var(--primary-glass);
  box-shadow: 0 0 12px var(--primary-glow);
}

.tab-icon-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: 0.6rem;
  transition: all 0.25s ease;
}

/* ===== GLASS PROGRESS RING ===== */
.glass-ring-track {
  stroke: var(--glass-border-subtle);
  fill: none;
}

.glass-ring-progress {
  fill: none;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--primary-glow));
  transition: stroke-dashoffset 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ===== GLASS LIST ROW ===== */
.glass-row {
  display: flex;
  align-items: center;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--glass-border-subtle);
  transition: background 0.2s ease;
}

.glass-row:last-child {
  border-bottom: none;
}

.glass-row:hover {
  background: var(--glass-bg-subtle);
}

/* ===== GLASS SCROLLBAR ===== */
.glass-scroll::-webkit-scrollbar {
  width: 4px;
}

.glass-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.glass-scroll::-webkit-scrollbar-thumb {
  background: var(--glass-border);
  border-radius: 999px;
}

/* ===== UTILITY: GRADIENT MESH BACKGROUND ===== */
.liquid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--background-gradient);
}

.liquid-bg::before {
  content: '';
  position: absolute;
  top: -20%;
  right: -20%;
  width: 60%;
  height: 60%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 122, 255, 0.08) 0%, transparent 70%);
  filter: blur(40px);
}

.liquid-bg::after {
  content: '';
  position: absolute;
  bottom: -10%;
  left: -15%;
  width: 50%;
  height: 50%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 45, 85, 0.06) 0%, transparent 70%);
  filter: blur(40px);
}
